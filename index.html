<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hishma by Binta | Modest Luxury</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&amp;family=Jost:wght@400;500&amp;display=swap">
<style id="css">
:root{--bg:#f7ecdc;--card:#fffaf2;--ink:#3b1a10;--brand:#5a2616;--gold:#b8893c;--line:#e4d2b8;--muted:#7a5d4d;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#241109;--card:#31180e;--ink:#f6e8d3;--brand:#d9a766;--gold:#d9a766;--line:#4d2c1d;--muted:#c4a68f}}
:root[data-theme="dark"]{--bg:#241109;--card:#31180e;--ink:#f6e8d3;--brand:#d9a766;--gold:#d9a766;--line:#4d2c1d;--muted:#c4a68f}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Jost,system-ui,sans-serif;line-height:1.5}
h1,h2,h3{font-family:"Cormorant Garamond",Georgia,serif;margin:0;font-weight:700}
header{background:#4a1f12;color:#f6e8d3;padding:14px 20px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:5}
.logo{font-family:"Cormorant Garamond",Georgia,serif;font-size:26px;font-weight:700;line-height:1}
.logo small{display:block;font-family:Jost,sans-serif;font-size:11px;letter-spacing:.18em;font-weight:400;color:#e2c48d}
button{font:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.cartbtn{background:#e2c48d;color:#3b1a10;border:0;border-radius:999px;padding:9px 16px;font-weight:500}
.hero{background:linear-gradient(135deg,#4a1f12,#6b2f1b);color:#f6e8d3;padding:28px 16px;text-align:center}
.hero img{width:min(460px,100%);height:auto;border-radius:14px;display:block;margin:0 auto}
.count{display:flex;gap:10px;justify-content:center;margin-top:18px}
.count div{background:rgba(255,255,255,.1);border-radius:12px;padding:8px 14px;min-width:64px}
.count b{display:block;font-family:"Cormorant Garamond",serif;font-size:30px;line-height:1.1}
.count span{font-size:12px;color:#e2c48d}
#saleLine{margin-top:14px;color:#ecd9bd}
main{max-width:1050px;margin:0 auto;padding:26px 16px 100px}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px}
.tab{background:transparent;border:1px solid var(--line);color:var(--ink);border-radius:999px;padding:8px 18px}
.tab[aria-pressed="true"]{background:var(--brand);color:var(--bg);border-color:var(--brand)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
.pic{aspect-ratio:4/5;position:relative;display:flex;align-items:center;justify-content:center;background:#ddd center/cover}
.pic img,.pic video{width:100%;height:100%;object-fit:cover;display:block;background:#000}
.badge{position:absolute;top:10px;left:10px;background:#8c1d1d;color:#fff;border-radius:999px;padding:3px 11px;font-size:13px;font-weight:500}
.thumbs{display:flex;gap:6px;padding:8px 14px 0}
.thumbs button{width:38px;height:38px;border:2px solid var(--line);border-radius:8px;padding:0;overflow:hidden;background:var(--bg);color:var(--ink);font-size:12px}
.thumbs button[aria-pressed="true"]{border-color:var(--brand)}
.thumbs img{width:100%;height:100%;object-fit:cover}
.body{padding:12px 14px 14px;display:flex;flex-direction:column;gap:6px;flex:1}
.body h3{font-size:22px}
.body p{margin:0;font-size:14px;color:var(--muted)}
.price{font-weight:500;font-size:18px}
.price s{color:var(--muted);font-size:14px;margin-left:6px;font-weight:400}
.sw{display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:13px;color:var(--muted)}
.sw button{width:28px;height:28px;border-radius:50%;border:2px solid var(--line);padding:0}
.sw button[aria-pressed="true"]{box-shadow:0 0 0 2px var(--card),0 0 0 4px var(--brand)}
.sw button.sz{width:auto;height:auto;border-radius:8px;padding:5px 12px;background:transparent;color:var(--ink);border:1px solid var(--line);font-size:13px}
.sw button.sz[aria-pressed="true"]{background:var(--brand);color:var(--bg);border-color:var(--brand);box-shadow:none}
.add{margin-top:auto;background:var(--brand);color:var(--bg);border:0;border-radius:10px;padding:10px;font-weight:500}
.mini{display:flex;gap:6px}
.mini button{flex:1;background:transparent;border:1px solid var(--line);color:var(--ink);border-radius:8px;padding:5px;font-size:13px}
.panel{position:fixed;inset:0 0 0 auto;width:min(420px,100%);background:var(--card);border-left:1px solid var(--line);z-index:10;display:flex;flex-direction:column;transform:translateX(100%);transition:transform .25s;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.panel.open{transform:none}
.ph{padding:16px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line)}
.items{flex:1;overflow:auto;padding:8px 16px}
.row{display:flex;gap:10px;padding:12px 0;border-bottom:1px solid var(--line);align-items:center}
.row .n{flex:1;font-size:14px}.row .n b{display:block;font-size:16px}
.qty{display:flex;align-items:center;gap:8px}
.qty button{width:30px;height:30px;border-radius:50%;border:1px solid var(--line);background:transparent;color:var(--ink)}
.rm{border:0;background:none;color:var(--muted);text-decoration:underline;font-size:13px;padding:0}
.pf{padding:16px;border-top:1px solid var(--line);display:grid;gap:10px}
input,textarea,select{width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit}
.tot{display:flex;justify-content:space-between;font-size:20px;font-weight:500}
.wa{background:#1f8f4e;color:#fff;border:0;border-radius:10px;padding:13px;font-weight:500}
.wa:disabled{opacity:.45;cursor:not-allowed}
.empty{padding:30px 0;text-align:center;color:var(--muted)}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:9;display:none}.scrim.on{display:block}
footer{text-align:center;padding:26px 16px;color:var(--muted);font-size:14px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#3b1a10;color:#f6e8d3;padding:10px 18px;border-radius:999px;z-index:30;opacity:0;pointer-events:none;transition:opacity .2s}.toast.on{opacity:1}
.adminbar{position:fixed;left:0;right:0;bottom:0;background:#2b1a14;color:#f6e8d3;padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));display:flex;gap:10px;align-items:center;justify-content:space-between;z-index:8;flex-wrap:wrap}
.adminbar button{border:0;border-radius:8px;padding:9px 14px;font-weight:500}
dialog{border:1px solid var(--line);border-radius:14px;background:var(--card);color:var(--ink);width:min(520px,94vw);max-height:90vh;padding:18px}
dialog::backdrop{background:rgba(0,0,0,.5)}
dialog label{display:block;font-size:13px;color:var(--muted);margin:10px 0 3px}
.ml{display:flex;gap:8px;flex-wrap:wrap}
.ml div{width:70px;font-size:12px;text-align:center}.ml img,.ml video{width:70px;height:70px;object-fit:cover;border-radius:8px}
#pdlg p{margin:8px 0}
@media (prefers-reduced-motion:reduce){.panel,.toast{transition:none}}
</style>
</head>

<script id="app">
var PHONE="2347046003220",BANK="Moniepoint",ACCNAME="Hishma by Binta Luxe Ventures",ACCNO="8057877435",CATS=["Abayas","Hijabs","Veils"];
var SALE_START=new Date("2026-11-15T00:00:00+01:00"),SALE_END=new Date("2026-12-05T23:59:59+01:00");
var DATA=JSON.parse(document.getElementById("data").textContent),P=DATA.products;
var cart={},cat="All",sel={},ssz={},slide={},admin=false,dirty=false,assets=null,art=null,editing=null,draftMedia=[];
function $(i){return document.getElementById(i)}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function naira(n){return "₦"+Math.round(n).toLocaleString("en-NG")}
function now(p){return p.off>0?p.price*(100-p.off)/100:p.price}
function find(id){return P.filter(function(p){return p.id===id})[0]}
function load(){try{cart=JSON.parse(localStorage.getItem("hishma_cart2")||"{}")||{}}catch(e){cart={}}}
function save(){try{localStorage.setItem("hishma_cart2",JSON.stringify(cart))}catch(e){}}
function toast(t){var e=$("toast");e.textContent=t;e.classList.add("on");clearTimeout(toast.t);toast.t=setTimeout(function(){e.classList.remove("on")},1600)}
function each(s,f){Array.prototype.forEach.call(document.querySelectorAll(s),f)}
function tabs(){
  $("tabs").innerHTML=["All"].concat(CATS).map(function(c){return '<button class="tab" aria-pressed="'+(c===cat)+'" data-c="'+c+'">'+c+'</button>'}).join("");
  each(".tab",function(b){b.onclick=function(){cat=b.dataset.c;tabs();grid()}});
}
function mediaHtml(m){return m.t==="vid"?'<video src="'+esc(m.u)+'" controls playsinline preload="metadata"></video>':'<img src="'+esc(m.u)+'" alt="" loading="lazy">'}
function grid(){
  var list=P.filter(function(p){return cat==="All"||p.cat===cat});
  $("grid").innerHTML=list.length?list.map(function(p){
    var cs=p.colours||[],ci=sel[p.id]||0;if(ci>=cs.length)ci=0;
    var mi=slide[p.id]||0;if(mi>=p.media.length)mi=0;
    var pic=p.media.length?mediaHtml(p.media[mi]):'<div style="width:100%;height:100%;background:'+(cs[ci]?esc(cs[ci].h):"#ddd")+'"></div>';
    var th=p.media.length>1?'<div class="thumbs">'+p.media.map(function(m,i){return '<button data-t="'+p.id+'" data-i="'+i+'" aria-pressed="'+(i===mi)+'" aria-label="Show '+(m.t==="vid"?"video":"photo")+' '+(i+1)+'">'+(m.t==="vid"?"▶":'<img src="'+esc(m.u)+'" alt="">')+'</button>'}).join("")+'</div>':"";
    return '<article class="card"><div class="pic">'+pic+(p.off>0?'<span class="badge">'+p.off+'% off</span>':"")+'</div>'+th+'<div class="body"><h3>'+esc(p.name)+'</h3><p>'+esc(p.desc)+'</p><div class="price">'+naira(now(p))+(p.off>0?'<s>'+naira(p.price)+'</s>':"")+'</div>'+
    (cs.length?'<div class="sw" role="group" aria-label="Colour">'+cs.map(function(c,i){return '<button data-s="'+p.id+'" data-i="'+i+'" style="background:'+esc(c.h)+'" aria-pressed="'+(i===ci)+'" aria-label="'+esc(c.n)+'" title="'+esc(c.n)+'"></button>'}).join("")+'<span>'+esc(cs[ci].n)+'</span></div>':"")+
    ((p.sizes&&p.sizes.length)?'<div class="sw" role="group" aria-label="Size"><span>Size:</span>'+p.sizes.map(function(z){return '<button class="sz" data-z="'+p.id+'" data-v="'+esc(z)+'" aria-pressed="'+(ssz[p.id]===z)+'">'+esc(z)+'</button>'}).join("")+'</div>':"")+'<button class="add" data-id="'+p.id+'">Add to cart</button>'+(admin?'<div class="mini"><button data-e="'+p.id+'">Edit</button><button data-d="'+p.id+'">Delete</button></div>':"")+'</div></article>'}).join(""):'<div class="empty">No products here yet.</div>';
  each(".add",function(b){b.onclick=function(){add(+b.dataset.id)}});
  each("[data-z]",function(b){b.onclick=function(){ssz[+b.dataset.z]=b.dataset.v;grid()}});
  each("[data-s]",function(b){b.onclick=function(){sel[+b.dataset.s]=+b.dataset.i;grid()}});
  each("[data-t]",function(b){b.onclick=function(){slide[+b.dataset.t]=+b.dataset.i;grid()}});
  each("[data-e]",function(b){b.onclick=function(){edit(+b.dataset.e)}});
  each("[data-d]",function(b){b.onclick=function(){var p=find(+b.dataset.d);if(p&&confirm("Delete "+p.name+"?")){P.splice(P.indexOf(p),1);changed();grid()}}});
}
function add(id){var p=find(id),cs=p.colours||[],ci=sel[id]||0,c=cs[ci]?cs[ci].n:"",z=ssz[id]||"";
  if(p.sizes&&p.sizes.length&&!z){toast("Please choose a size first");return}
  var k=id+"~"+c+"~"+z;cart[k]=cart[k]||{id:id,c:c,s:z,q:0};cart[k].q++;save();render();toast("Added to cart")}
function chg(k,d){cart[k].q+=d;if(cart[k].q<=0)delete cart[k];save();render()}
function render(){
  var keys=Object.keys(cart).filter(function(k){return find(cart[k].id)}),total=0,n=0;
  $("items").innerHTML=keys.length?keys.map(function(k){var it=cart[k],p=find(it.id);total+=now(p)*it.q;n+=it.q;
    return '<div class="row"><div class="n"><b>'+esc(p.name)+'</b>'+(it.c||it.s?esc([it.c,it.s&&"Size "+it.s].filter(Boolean).join(", "))+" | ":"")+naira(now(p))+' <button class="rm" data-r="'+esc(k)+'">Remove</button></div><div class="qty"><button data-m="'+esc(k)+'" aria-label="Less">−</button><span>'+it.q+'</span><button data-p="'+esc(k)+'" aria-label="More">+</button></div></div>'}).join(""):'<div class="empty">Your cart is empty. Add something you like.</div>';
  $("cnt").textContent=n;$("total").textContent=naira(total);$("send").disabled=!keys.length;
  each("[data-m]",function(b){b.onclick=function(){chg(b.dataset.m,-1)}});
  each("[data-p]",function(b){b.onclick=function(){chg(b.dataset.p,1)}});
  each("[data-r]",function(b){b.onclick=function(){delete cart[b.dataset.r];save();render()}});
}
function open(o){$("panel").classList.toggle("open",o);$("scrim").classList.toggle("on",o)}
$("openCart").onclick=function(){open(true)};$("closeCart").onclick=function(){open(false)};$("scrim").onclick=function(){open(false)};
document.addEventListener("keydown",function(e){if(e.key==="Escape")open(false)});
$("send").onclick=function(){
  var total=0,lines=Object.keys(cart).filter(function(k){return find(cart[k].id)}).map(function(k){var it=cart[k],p=find(it.id),s=now(p)*it.q;total+=s;return "- "+p.name+(it.c||it.s?" ("+[it.c,it.s&&"Size "+it.s].filter(Boolean).join(", ")+")":"")+" x"+it.q+" = "+naira(s)});
  var nm=$("name").value.trim(),nt=$("note").value.trim();
  pay(total,lines,nm,nt);
};
function pay(total,lines,nm,nt){
  var d=$("pdlg"),base="Hello Hishma by Binta, I would like to order:\n"+lines.join("\n")+"\nTotal: "+naira(total)+(nm?"\nName: "+nm:"")+(nt?"\nNote: "+nt:"");
  function wa(extra){window.open("https://wa.me/"+PHONE+"?text="+encodeURIComponent(base+extra),"_blank")}
  d.innerHTML='<h2>Pay by bank transfer</h2><p>Transfer exactly <b>'+naira(total)+'</b> to:</p><p><b>'+BANK+'</b><br>'+ACCNAME+'<br><span style="font-size:26px;letter-spacing:.06em;font-weight:500">'+ACCNO+'</span></p><button class="tab" id="pCopy">Copy account number</button><p style="font-size:13px;color:var(--muted)">Check that the account name shows as '+ACCNAME+' before you confirm the transfer. After paying, send your proof of payment on WhatsApp so we can confirm your order.</p><button class="wa" id="pPaid" style="width:100%">I have paid, send proof on WhatsApp</button><p><button class="rm" id="pAsk">Ask a question first</button> &nbsp; <button class="rm" id="pLater">Send order only, I will pay later</button> &nbsp; <button class="rm" id="pX">Close</button></p>';
  $("pCopy").onclick=function(){try{navigator.clipboard.writeText(ACCNO).then(function(){toast("Account number copied")},function(){toast("Copy it by hand: "+ACCNO)})}catch(e){toast("Copy it by hand: "+ACCNO)}};
  $("pPaid").onclick=function(){wa("\nI have made the transfer and will send my proof of payment here.")};
  $("pLater").onclick=function(){wa("\nI will pay after you confirm my order.")};
  $("pAsk").onclick=function(){wa("\nI have a question before I pay.")};
  $("pX").onclick=function(){d.close()};
  d.showModal();
}
function tick(){
  var n=new Date(),t,lab;
  if(n<SALE_START){t=SALE_START-n;lab="Sale starts in"}else if(n<=SALE_END){t=SALE_END-n;lab="Sale ends in"}
  else{$("count").innerHTML="";$("saleLine").textContent="The sale has ended. Message us for current prices.";return}
  var d=Math.floor(t/864e5),h=Math.floor(t%864e5/36e5),m=Math.floor(t%36e5/6e4),s=Math.floor(t%6e4/1e3);
  $("count").innerHTML=[[d,"days"],[h,"hours"],[m,"mins"],[s,"secs"]].map(function(x){return '<div><b>'+x[0]+'</b><span>'+x[1]+'</span></div>'}).join("");
  $("saleLine").textContent=lab;
}
/* ---------- owner tools (only shown to the page owner/editors) ---------- */
function changed(){dirty=true;bar()}
function bar(msg){var b=$("adminbar");b.hidden=!admin;if(!admin)return;
  b.innerHTML='<span>'+(msg||(dirty?"You have unpublished changes.":"Owner mode: add or edit products."))+'</span><span><button id="addP" style="background:#e2c48d">Add product</button> <button id="pub" style="background:#1f8f4e;color:#fff"'+(dirty?"":" disabled")+'>Publish changes</button></span>';
  $("addP").onclick=function(){edit(null)};$("pub").onclick=publish}
function edit(id){
  editing=id;var p=id?find(id):{name:"",cat:"Abayas",desc:"",price:"",off:0,colours:[],media:[]};draftMedia=p.media.slice();
  var d=$("dlg");
  d.innerHTML='<h2>'+(id?"Edit product":"Add product")+'</h2><label>Name</label><input id="fN" value="'+esc(p.name)+'"><label>Category</label><select id="fC">'+CATS.map(function(c){return '<option'+(c===p.cat?" selected":"")+'>'+c+'</option>'}).join("")+'</select><label>Description</label><input id="fD" value="'+esc(p.desc)+'"><label>Sizes, separated by commas (example: 52, 54, 56; leave empty if none)</label><input id="fZ" value="'+esc((p.sizes||[]).join(", "))+'"><label>Original price (₦)</label><input id="fP" type="number" min="0" value="'+esc(p.price)+'"><label>Discount % (0 for none)</label><input id="fO" type="number" min="0" max="90" value="'+esc(p.off)+'"><label>Colours, one per line as: Name, #hex (example: Black, #1e1511)</label><textarea id="fK" rows="4">'+esc((p.colours||[]).map(function(c){return c.n+", "+c.h}).join("\n"))+'</textarea><label>Photos and videos (videos up to 20 MB)</label><div class="ml" id="fM"></div><input id="fF" type="file" accept="image/*,video/*" multiple><p id="fS" style="font-size:13px"></p><div style="display:flex;gap:8px;margin-top:10px"><button class="wa" id="fOk" style="flex:1">Save product</button><button class="tab" id="fX">Cancel</button></div>';
  mlist();$("fX").onclick=function(){d.close()};$("fOk").onclick=saveP;$("fF").onchange=upload;d.showModal();
}
function mlist(){$("fM").innerHTML=draftMedia.map(function(m,i){return '<div>'+mediaHtml(m)+'<button class="rm" data-x="'+i+'">Remove</button></div>'}).join("");
  each("[data-x]",function(b){b.onclick=function(){draftMedia.splice(+b.dataset.x,1);mlist()}})}
async function upload(e){
  var fs=Array.prototype.slice.call(e.target.files);if(!assets){$("fS").textContent="Uploads are not available here.";return}
  for(var i=0;i<fs.length;i++){$("fS").textContent="Uploading "+(i+1)+" of "+fs.length+"...";
    try{var r=await assets.upload(fs[i]);draftMedia.push({t:/^video/.test(r.contentType||fs[i].type)?"vid":"img",u:r.url});mlist()}
    catch(err){$("fS").textContent="Could not upload "+fs[i].name+". Photos and videos must be under 20 MB.";return}}
  $("fS").textContent="Uploaded. Tap Save product.";
}
function saveP(){
  var name=$("fN").value.trim(),price=+$("fP").value;if(!name||!(price>0)){$("fS").textContent="Enter a name and a price.";return}
  var cs=$("fK").value.split("\n").map(function(l){var i=l.lastIndexOf(",");return i<0?null:{n:l.slice(0,i).trim(),h:l.slice(i+1).trim()}}).filter(function(c){return c&&c.n&&/^#[0-9a-f]{3,8}$/i.test(c.h)});
  var o={id:editing||(P.reduce(function(m,p){return Math.max(m,p.id)},0)+1),cat:$("fC").value,name:name,sizes:$("fZ").value.split(",").map(function(z){return z.trim()}).filter(Boolean),desc:$("fD").value.trim(),price:price,off:Math.min(90,Math.max(0,+$("fO").value||0)),colours:cs,media:draftMedia};
  if(editing)P[P.indexOf(find(editing))]=o;else P.push(o);
  $("dlg").close();changed();grid();
}
async function publish(){
  if(!art)return;bar("Publishing...");
  var c=document.documentElement.cloneNode(true);
  ["grid","tabs","items","count","adminbar","dlg","saleLine"].forEach(function(i){var e=c.querySelector("#"+i);if(e)e.innerHTML=""});
  var a=c.querySelector("#adminbar");if(a)a.setAttribute("hidden","");
  c.querySelector("#panel").className="panel";c.querySelector("#scrim").className="scrim";c.querySelector("#toast").className="toast";
  Array.prototype.forEach.call(c.querySelectorAll("script"),function(s){if(s.id!=="app"&&s.id!=="data")s.remove()});
  c.querySelector("#data").textContent=JSON.stringify({products:P}).replace(/</g,"\\u003c");
  try{await art.publish("<!DOCTYPE html>\n"+c.outerHTML);dirty=false}catch(e){bar("Publish failed: "+(e&&e.code||"error")+". Try again.")}
}
load();tabs();grid();render();tick();setInterval(tick,1000);
(async function(){try{
  var u=await claude.use("user");if(!u||!(u.isOwner()||u.canEdit()))return;
  assets=await claude.use("assets");art=await claude.use("artifact");
  if(art){admin=true;bar();grid()}
}catch(e){}})();
</script>
